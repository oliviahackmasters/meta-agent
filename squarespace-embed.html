<div id="hmTrendChat">
  <div class="hm-wrap">
    <div class="hm-title">
      <span>Meta LLM Agent</span>
      <span class="hm-badge">OpenAI + Claude + Gemini</span>
      <span id="hm-status" class="hm-status">idle</span>
    </div>
    <p class="hm-sub">One prompt to all providers. The first successful answer appears above; all raw outputs are visible.</p>

    <div class="hm-row">
      <textarea id="prompt" class="hm-textarea" placeholder="Ask anything..."></textarea>
      <button id="send" class="hm-btn">Send</button>
    </div>

    <div class="hm-chat" id="chatTranscript"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const API_ENDPOINT = "https://meta-agent-opal.vercel.app/api/meta-llm"; // update to your Vercel deployment
const btn = document.getElementById("send");
const promptInput = document.getElementById("prompt");
const statusEl = document.getElementById("hm-status");
const transcript = document.getElementById("chatTranscript");

async function ask() {
  const prompt = input.value.trim();
  if (!prompt || busy) return;

  busy = true;
  sendBtn.disabled = true;
  sendBtn.textContent = "Sending...";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ prompt })
    });

    const json = await response.json();

    if (!response.ok) {
      throw new Error(json.error || "Request failed");
    }

    renderConversation(
      prompt,
      json.results || [],
      json.chosen?.text || ""
    );

    input.value = "";

    const count = Array.isArray(json.results)
      ? json.results.filter(item => item.text && !item.error).length
      : 0;

    if (counter) {
      counter.textContent = `RESULTS: ${count}/3`;
    }
  } catch (err) {
    transcript.innerHTML = "";

    const userWrap = document.createElement("div");
    userWrap.className = "hm-user-wrap";
    userWrap.appendChild(createPlainTextCard("you", prompt, "hm-me"));
    transcript.appendChild(userWrap);

    const bestWrap = document.createElement("div");
    bestWrap.className = "hm-best-wrap";
    bestWrap.appendChild(
      createPlainTextCard("error", err.message || "Something went wrong", "hm-ai")
    );
    transcript.appendChild(bestWrap);

    if (counter) {
      counter.textContent = "RESULTS: 0/3";
    }
  } finally {
    busy = false;
    sendBtn.disabled = false;
    sendBtn.textContent = "SEND";
  }
}

function createTextCard(titleText, content, cssClass = "") {
  const card = document.createElement("div");
  card.className = `hm-msg ${cssClass}`.trim();

  const title = document.createElement("div");
  title.className = "hm-msg-title";
  title.textContent = titleText;

  const body = document.createElement("div");
  body.className = "hm-msg-body";
  body.innerHTML = marked.parse(content || "");

  card.appendChild(title);
  card.appendChild(body);

  return card;
}

function createPlainTextCard(titleText, content, cssClass = "") {
  const card = document.createElement("div");
  card.className = `hm-msg ${cssClass}`.trim();

  const title = document.createElement("div");
  title.className = "hm-msg-title";
  title.textContent = titleText;

  const body = document.createElement("div");
  body.className = "hm-msg-body";
  body.textContent = content || "";

  card.appendChild(title);
  card.appendChild(body);

  return card;
}

function renderConversation(prompt, results, chosenText) {
  transcript.innerHTML = "";

  const userWrap = document.createElement("div");
  userWrap.className = "hm-user-wrap";
  userWrap.appendChild(createPlainTextCard("you", prompt, "hm-me"));
  transcript.appendChild(userWrap);

  const grid = document.createElement("div");
  grid.className = "hm-results-grid";

  const providerOrder = ["gemini", "openai", "claude"];

  providerOrder.forEach((providerName) => {
    const match = (results || []).find(
      (item) => (item.provider || "").toLowerCase() === providerName
    );

    const content = match
      ? (match.text || match.error || "no response")
      : "no response";

    const card = document.createElement("div");
    card.className = "hm-result-card";
    card.appendChild(createTextCard(providerName, content, "hm-ai"));
    grid.appendChild(card);
  });

  transcript.appendChild(grid);

  const bestWrap = document.createElement("div");
  bestWrap.className = "hm-best-wrap";
  bestWrap.appendChild(
    createTextCard("best / combined response", chosenText || "no response", "hm-ai")
  );
  transcript.appendChild(bestWrap);

  transcript.scrollTop = 0;
}

btn.onclick = ask;
</script>
