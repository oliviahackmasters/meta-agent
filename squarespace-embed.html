<style>
  :root{
    --hm-black:#000000;
    --hm-white:#FFFFFF;
    --hm-copper:#D18057;
  }

  #hmMetaCog,
  #hmMetaCog * {
    box-sizing: border-box;
  }

#hmMetaCog {
  width: 100%;
}

#hmMetaCog .hm-wrap{
  width: 100%;
  max-width: 100%;
  min-height: 85vh;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px;
  border: 1px solid var(--hm-copper);
}

  #hmMetaCog .hm-title{
    display:flex;
    align-items:center;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    font-size: 14px;
    color: var(--hm-white);
    gap: 10px;
    margin: 0 0 4px 0;
    
  }

  #hmMetaCog .hm-title .hm-badge{
    display:inline-block;
    border: 1px solid var(--hm-copper);
    padding: 6px 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    font-size: 12px;
    color: var(--hm-copper);
  }

  #hmMetaCog .hm-sub{
    margin: 0 0 6px 0;
    font-size: 12px;
    line-height: 1.5;
    color: rgba(255,255,255,0.85);
  }

  #hmMetaCog .hm-row{
     display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: stretch;
      width: 100%;
  }

  #hmMetaCog .hm-textarea{
      width: 100%;
      min-width: 0;
      line-height: 1.4;
      width:100%;
      background: transparent;
      color: var(--hm-white);
      border: 1px solid var(--hm-copper);
      font-size: 13px;
      outline: none;
      height: 52px;
      min-height: 52px;
      max-height: 180px;
      resize: none;
      overflow-y: auto;
      padding: 14px 16px;
  }

  #hmMetaCog .hm-btn{
    white-space: nowrap;
    height: 52px;
    min-height: 52px;
    align-self: end;
    appearance:none;
    background: transparent;
    color: var(--hm-white);
    border: 1px solid var(--hm-copper);
    padding: 10px 12px;
    cursor:pointer;
    text-transform: uppercase;
    letter-spacing: 1.1px;
    font-weight: 600;
    font-size: 12px;
    line-height: 1;
    border-radius: 0;
    transition: background 120ms linear, color 120ms linear;
    box-sizing: border-box;
  }
  #hmMetaCog .hm-btn:hover{
    background: var(--hm-copper);
    color: var(--hm-black);
  }
  #hmMetaCog .hm-btn:disabled{
    opacity: 0.55;
    cursor:not-allowed;
  }

  #hmMetaCog .hm-status{
    margin-left:auto;
    font-size: 12px;
    letter-spacing: 0.9px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
  }
  #hmMetaCog .hm-status.is-error{ color: var(--hm-copper); }

  #hmMetaCog .hm-chat{
    width: 100%;
    max-width: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    border: 1px solid var(--hm-copper);
    padding: 8px;
    height: clamp(280px, 58vh, 720px);
  }

  #hmMetaCog .hm-msg{
    border: 1px solid rgba(209,128,87,0.55);
    padding: 10px 12px;
    margin: 0 0 10px 0;
    border-radius: 0;
    word-break: break-word;
    line-height: 1.6;
    font-size: 13px;
  }
  #hmMetaCog .hm-msg.hm-me{
    background: rgba(209,128,87,0.10);
  }
  #hmMetaCog .hm-msg.hm-ai{
    background: transparent;
    border: 0;
    padding: 0;
  }

  #hmMetaCog .hm-msg-title{
  margin: 0 0 8px 0;
  font-size: 12px;
  font-weight: 700;
  text-transform: lowercase;
  letter-spacing: 0.8px;
  color: var(--hm-white);
}

#hmMetaCog .hm-msg-body{
  word-break: break-word;
  overflow-wrap: anywhere;
}

#hmMetaCog .hm-msg-body > :first-child{
  margin-top: 0;
}

#hmMetaCog .hm-msg-body > :last-child{
  margin-bottom: 0;
}

#hmMetaCog .hm-msg-body p{
  font-size: 13px;
  line-height: 1.5;
  margin: 0 0 8px 0;
}

#hmMetaCog .hm-msg-body h1{
  font-size: 16px;
  font-weight: 700;
  margin: 0 0 8px 0;
}

#hmMetaCog .hm-msg-body h2{
  font-size: 15px;
  font-weight: 600;
  margin: 0 0 8px 0;
}

#hmMetaCog .hm-msg-body h3{
  font-size: 14px;
  font-weight: 600;
  margin: 0 0 6px 0;
}

#hmMetaCog .hm-msg-body h4{
  font-size: 13px;
  font-weight: 600;
  margin: 0 0 6px 0;
}

#hmMetaCog .hm-msg-body ul,
#hmMetaCog .hm-msg-body ol{
  margin: 0 0 10px 18px;
  padding: 0;
}

#hmMetaCog .hm-msg-body li{
  margin: 0 0 6px 0;
  font-size: 13px;
  line-height: 1.5;
}

#hmMetaCog .hm-msg-body strong{
  font-weight: 700;
}

#hmMetaCog .hm-msg-body em{
  font-style: italic;
}

#hmMetaCog .hm-msg-body code{
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px;
  padding: 1px 4px;
  border: 1px solid rgba(209,128,87,0.55);
  background: rgba(255,255,255,0.03);
}

#hmMetaCog .hm-msg-body pre{
  overflow: auto;
  padding: 10px;
  border: 1px solid rgba(209,128,87,0.55);
  background: rgba(255,255,255,0.03);
  margin: 0 0 10px 0;
}

#hmMetaCog .hm-msg-body pre code{
  border: 0;
  padding: 0;
  background: transparent;

#hmMetaCog .hm-msg-body blockquote{
  margin: 0 0 10px 0;

  border-left: 2px solid var(--hm-copper);

#hmMetaCog .hm-user-wrap{

</style>

<div id="hmMetaCog">
  <div class="hm-wrap">
    <div class="hm-title">
      <span>Meta LLM Agent</span>
      <span class="hm-badge">OpenAI + Claude + Gemini + Infomaniak + DeepSeek</span>
      <span id="hm-status" class="hm-status">idle</span>
      </div>
      <p class="hm-sub">Choose one or more models, compare the outputs, and review the combined response below.</p>
      

    <div class="hm-chat" id="chatTranscript">
      <div class="hm-loader" id="hmLoader">
        <div class="hm-loader-radar"></div>
        <div class="hm-loader-text">Thinking...</div>
      </div>
    </div>

    <div class="hm-provider-picker">
          <span class="hm-provider-label">Use models:</span>

        <label class="hm-provider-option">
          <input type="checkbox" value="openai" checked>
          <span>OpenAI</span>
        </label>

        <label class="hm-provider-option">
          <input type="checkbox" value="claude" checked>
          <span>Claude</span>
        </label>

        <label class="hm-provider-option">
          <input type="checkbox" value="gemini" checked>
          <span>Gemini</span>
        </label>

        <label class="hm-provider-option">
          <input type="checkbox" value="infomaniak">
          <span>Infomaniak</span>
        </label>

        <label class="hm-provider-option">
          <input type="checkbox" value="deepseek">
          <span>DeepSeek</span>
        </label>

       
      </div>

    <div class="hm-row">
      <textarea id="prompt" class="hm-textarea" placeholder="Ask anything..."></textarea>
      <button id="send" class="hm-btn">Send</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const API_ENDPOINT = "https://meta-agent-opal.vercel.app/api/meta-llm"; // update to your Vercel deployment
const btn = document.getElementById("send");
const loader = document.getElementById("hmLoader");
const promptInput = document.getElementById("prompt");
const statusEl = document.getElementById("hm-status");
const transcript = document.getElementById("chatTranscript");
let busy = false;
const providerInputs = Array.from(
  document.querySelectorAll('.hm-provider-picker input[type="checkbox"]')
);

async function ask() {
  loader.style.display = "block";
  const prompt = promptInput.value.trim();
  autoResizeTextarea();
  if (!prompt || busy) return;

  const providers = getSelectedProviders();
  if (!providers.length) {
    statusEl.textContent = "select at least one model";
    return;
  }

  busy = true;
  btn.disabled = true;
  btn.textContent = "Sending...";

  try {
    const response = await fetch(API_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prompt,
        providers
      })
    });

    const json = await response.json();

    if (!response.ok) {
      throw new Error(json.error || "Request failed");
    }

    renderConversation(
      prompt,
      json.results || [],
      json.combined?.text || "",
      json.selectedProviders || []
    );

    promptInput.value = "";

    

    
  } catch (err) {
    transcript.innerHTML = "";

    const userWrap = document.createElement("div");
    userWrap.className = "hm-user-wrap";
    userWrap.appendChild(createPlainTextCard("you", prompt, "hm-me"));
    transcript.appendChild(userWrap);

    const bestWrap = document.createElement("div");
    bestWrap.className = "hm-best-wrap";
    bestWrap.appendChild(
      createPlainTextCard("error", err.message || "Something went wrong", "hm-ai")
    );
    transcript.appendChild(bestWrap);

  
  } finally {
    busy = false;
    btn.disabled = false;
    btn.textContent = "SEND";
  }
}

function getSelectedProviders() {
  return providerInputs
    .filter((input) => input.checked)
    .map((input) => input.value);
}

function autoResizeTextarea() {
  promptInput.style.height = "52px";
  promptInput.style.height = `${Math.min(promptInput.scrollHeight, 180)}px`;
}

function createTextCard(titleText, content, cssClass = "") {
  const card = document.createElement("div");
  card.className = `hm-msg ${cssClass}`.trim();

  const title = document.createElement("div");
  title.className = "hm-msg-title";
  title.textContent = titleText;

  const body = document.createElement("div");
  body.className = "hm-msg-body";
  body.innerHTML = marked.parse(content || "");

  card.appendChild(title);
  card.appendChild(body);

  return card;
}

function createPlainTextCard(titleText, content, cssClass = "") {
  const card = document.createElement("div");
  card.className = `hm-msg ${cssClass}`.trim();

  const title = document.createElement("div");
  title.className = "hm-msg-title";
  title.textContent = titleText;

  const body = document.createElement("div");
  body.className = "hm-msg-body";
  body.textContent = content || "";

  card.appendChild(title);
  card.appendChild(body);

  return card;
}

function renderConversation(prompt, results, combinedText, selectedProviders) {
  loader.style.display = "none";
  transcript.innerHTML = "";

  const userWrap = document.createElement("div");
  userWrap.className = "hm-user-wrap";
  userWrap.appendChild(createPlainTextCard("you", prompt, "hm-me"));
  transcript.appendChild(userWrap);

  const grid = document.createElement("div");
  grid.className = "hm-results-grid";

  const providerOrder = selectedProviders.length
    ? selectedProviders
    : (results || []).map((item) => (item.provider || "").toLowerCase());

  providerOrder.forEach((providerName) => {
    const match = (results || []).find(
      (item) => (item.provider || "").toLowerCase() === providerName
    );

    const content = match
      ? (match.text || match.error || "no response")
      : "no response";

    const card = document.createElement("div");
    card.className = "hm-result-card";
    card.appendChild(createTextCard(providerName, content, "hm-ai"));
    grid.appendChild(card);
  });

  transcript.appendChild(grid);

  const bestWrap = document.createElement("div");
  bestWrap.className = "hm-best-wrap";
  bestWrap.appendChild(
    createTextCard("COMBINED RESPONSE", combinedText || "no response", "hm-ai")
  );
  transcript.appendChild(bestWrap);

  transcript.scrollTop = 0;
}

promptInput.addEventListener("input", autoResizeTextarea);
autoResizeTextarea();
btn.onclick = ask;
</script>
